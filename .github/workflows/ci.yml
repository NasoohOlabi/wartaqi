name: Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: notebook_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: npm run setup:security
      - run: npm run security:history
      - run: npm run security:audit
      - name: Prepare disposable databases
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres@127.0.0.1:5432/notebook_test
        run: |
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -f railway/001-auth.sql
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -f railway/002-mcp-oauth.sql
          npm run db:migrate
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE student_names_test'
      - run: npm run verify
        env:
          TEST_RAILWAY_DATABASE_URL: postgres://postgres@127.0.0.1:5432/notebook_test
          TEST_STUDENT_NAMES_DATABASE_URL: postgres://postgres@127.0.0.1:5432/student_names_test
          TEST_STUDENT_TRANSFER_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: Test workbook preparation
        run: |
          python3 -m venv "$RUNNER_TEMP/workbook-tests"
          "$RUNNER_TEMP/workbook-tests/bin/pip" install openpyxl==3.1.5 ruff==0.15.12
          "$RUNNER_TEMP/workbook-tests/bin/ruff" check .
          "$RUNNER_TEMP/workbook-tests/bin/ruff" format --check .
          "$RUNNER_TEMP/workbook-tests/bin/python" -m unittest discover -s tests -p 'test_*.py'
      - run: npm run security:files
      - name: Verify native Telegram polling, encrypted state and assistant
        run: cargo test --locked --manifest-path rust-telegram/Cargo.toml
      - name: Build standalone Telegram worker
        run: docker build -f telegram/Dockerfile .

      - name: Install Chromium for the real-server test
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          npx playwright install --with-deps chromium
      - name: Verify offline writes and live delivery between independent browsers
        env:
          TEST_RAILWAY_DATABASE_URL: postgres://postgres@127.0.0.1:5432/notebook_test
        run: npx playwright test e2e/workspace-sync.spec.ts --project=chromium --trace=off

  web-image:
    name: Production web image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: notebook_test
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t wartaq-web .
      - name: Serve React, notebook APIs and OAuth from the Rust executable
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/notebook_test
          BETTER_AUTH_URL: http://127.0.0.1:48083
          PORT: '48083'
        run: |
          for migration in railway/*.sql neon/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration"; done
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          docker run -d --name wartaq-web --network host -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e PORT wartaq-web
          docker exec wartaq-web sh -ec '! command -v node && ! command -v bun'
          curl --retry 12 --retry-delay 1 --retry-all-errors -fsS "$BETTER_AUTH_URL/health" | jq -e '.ok == true'
          shell=$(curl -fsS "$BETTER_AUTH_URL/")
          asset=$(printf '%s\n' "$shell" | sed -n 's/.*src="\.\/\(assets\/[^"]*\.js\)".*/\1/p')
          test -n "$asset"
          curl --compressed -fsS -D "$RUNNER_TEMP/asset-headers" -o /dev/null "$BETTER_AUTH_URL/$asset"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/asset-headers"
          grep -qi '^cache-control: .*immutable' "$RUNNER_TEMP/asset-headers"
          curl -fsS "$BETTER_AUTH_URL/api/auth/get-session" | jq -e '. == null'
          curl -fsS "$BETTER_AUTH_URL/.well-known/oauth-protected-resource/mcp" | jq -e --arg resource "$BETTER_AUTH_URL/mcp" '.resource == $resource'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: Check Node and Rust contracts and offline delivery with the shipped executable
        env:
          TEST_RAILWAY_DATABASE_URL: postgres://postgres@127.0.0.1:5432/notebook_test
        run: |
          docker cp wartaq-web:/usr/local/bin/wartaq-web "$RUNNER_TEMP/wartaq-web"
          docker cp wartaq-web:/app/dist ./dist
          docker stop wartaq-web
          export TEST_RUST_SYNC_BINARY="$RUNNER_TEMP/wartaq-web" TEST_RUST_BROWSER_BINARY="$RUNNER_TEMP/wartaq-web"
          npm test -- tests/rust-backend-parity.test.ts tests/sync-transport.test.ts
          TEST_RUST_WEB_BINARY="$RUNNER_TEMP/wartaq-web" npm test -- tests/oauth-runtime-parity.test.ts tests/mcp-integration.test.ts tests/telegram-integration.test.ts tests/telegram-phone-integration.test.ts tests/invitations-integration.test.ts tests/device-accounts-integration.test.ts tests/admin-password-reset.test.ts
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          npx playwright install --with-deps chromium
          npx playwright test e2e/workspace-sync.spec.ts --project=chromium --trace=off

  browser:
    name: Browser tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: Install Chromium and its Ubuntu dependencies
        run: |
          # Chromium uses Ubuntu packages. Keep the unrelated runner feed out of apt update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          npx playwright install --with-deps chromium
      - name: Run Playwright shard
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run verify:ui -- --shard="$SHARD" --trace=retain-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-${{ github.sha }}-shard-${{ matrix.shard }}
          path: .artifacts/playwright-report/
          retention-days: 7

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [core, browser, web-image]
    if: ${{ always() }}
    steps:
      - name: Require core and browser results
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WEB_IMAGE_RESULT: ${{ needs['web-image'].result }}
        run: |
          printf 'Core checks: %s\nBrowser tests: %s\n' "$CORE_RESULT" "$BROWSER_RESULT"
          test "$CORE_RESULT" = success && test "$BROWSER_RESULT" = success
          test "$WEB_IMAGE_RESULT" = success
