name: Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: notebook_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run setup:security
      - run: bun run security:history
      - run: bun run security:audit
      - name: Prepare disposable databases
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres@127.0.0.1:5432/notebook_test
        run: |
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -f railway/001-auth.sql
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -f railway/002-mcp-oauth.sql
          bun run db:migrate
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE student_names_test'
      - run: bun run verify
        env:
          TEST_RAILWAY_DATABASE_URL: postgres://postgres@127.0.0.1:5432/notebook_test
          TEST_STUDENT_NAMES_DATABASE_URL: postgres://postgres@127.0.0.1:5432/student_names_test
          TEST_STUDENT_TRANSFER_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: Test workbook preparation
        run: |
          python3 -m venv "$RUNNER_TEMP/workbook-tests"
          "$RUNNER_TEMP/workbook-tests/bin/pip" install openpyxl==3.1.5 ruff==0.15.12
          "$RUNNER_TEMP/workbook-tests/bin/ruff" check .
          "$RUNNER_TEMP/workbook-tests/bin/ruff" format --check .
          "$RUNNER_TEMP/workbook-tests/bin/python" -m unittest discover -s tests -p 'test_*.py'
      - run: bun run security:files
      - name: Build standalone Telegram worker
        run: docker build -f telegram/Dockerfile .

  browser:
    name: Browser tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: Install Chromium and its Ubuntu dependencies
        run: |
          # Chromium uses Ubuntu packages. Keep the unrelated runner feed out of apt update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium
      - name: Run Playwright shard
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bun run verify:ui --shard="$SHARD" --trace=retain-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-${{ github.sha }}-shard-${{ matrix.shard }}
          path: .artifacts/playwright-report/
          retention-days: 7

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [core, browser]
    if: ${{ always() }}
    steps:
      - name: Require core and browser results
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          printf 'Core checks: %s\nBrowser tests: %s\n' "$CORE_RESULT" "$BROWSER_RESULT"
          test "$CORE_RESULT" = success && test "$BROWSER_RESULT" = success
